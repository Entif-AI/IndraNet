[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "indranet-context-reference"
version = "0.5.0"
description = "Candidate physical-world context composition with synthetic examples"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4", "rdflib>=7", "cryptography>=41"]
[tool.setuptools.packages.find]
where = ["src"]
